version: "3.9"

services:
  devopsdb:
    image: dbimage
    ports:
      - "3306:3306"
    volumes:
      - myvol:/var/lib/mysql/
    environment:
      MYSQL_ROOT_PASSWORD : "devopspassword"

  application:
    image: appimage
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb

volumes:
  myvol:
